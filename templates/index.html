{% extends "base.html" %}

{% block content %}
<section class="page-title">
  <h1>公開情報</h1>
  <p>プレスリリース、製品のお知らせ、キャンペーン情報を掲載しています。</p>
</section>

<form class="filters" method="get" action="{{ url_for('index') }}">
  <label for="category">カテゴリ</label>
  <select id="category" name="category">
    <option value="">すべて</option>
    {% for category in categories %}
      <option value="{{ category.code }}" {% if selected_category == category.code %}selected{% endif %}>
        {{ category.name }}
      </option>
    {% endfor %}
  </select>
  <button type="submit">表示</button>
</form>

<section class="content-list" aria-label="公開情報一覧">
  {% for item in contents %}
    <article class="content-card">
      <div class="meta">
        <span>{{ item.category_name }}</span>
        <time datetime="{{ item.published_at }}">{{ item.published_at.strftime("%Y-%m-%d") }}</time>
      </div>
      <h2><a href="{{ url_for('content_detail', content_id=item.id) }}">{{ item.title }}</a></h2>
      <p>{{ item.summary }}</p>
    </article>
  {% else %}
    <p class="empty">該当する公開情報はありません。</p>
  {% endfor %}
</section>
{% endblock %}
